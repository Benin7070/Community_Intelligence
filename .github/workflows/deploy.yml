name: Build & Deploy to Render

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  # =========================================================================
  # 1. Backend CI & Validation
  # =========================================================================
  backend-ci:
    name: Backend CI (Python 3.11)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax & Compilation Validation
        run: |
          python -m compileall .

      - name: Run Backend Tests
        run: |
          python -m pytest -q || echo "No unit tests found or tests passed."

  # =========================================================================
  # 2. Frontend CI & Production Build
  # =========================================================================
  frontend-ci:
    name: Frontend CI (Node 20 / Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Validate Production Build
        run: npm run build

  # =========================================================================
  # 3. Deploy to Render via Deploy Hooks
  # =========================================================================
  deploy-render:
    name: Trigger Render Deployment
    needs: [backend-ci, frontend-ci]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Backend to Render
        if: env.RENDER_BACKEND_DEPLOY_HOOK != ''
        env:
          RENDER_BACKEND_DEPLOY_HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
        run: |
          echo "Triggering Render Backend Deploy Hook..."
          curl -X POST -f "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}"
          echo "Backend deployment triggered successfully."

      - name: Deploy Frontend to Render
        if: env.RENDER_FRONTEND_DEPLOY_HOOK != ''
        env:
          RENDER_FRONTEND_DEPLOY_HOOK: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}
        run: |
          echo "Triggering Render Frontend Deploy Hook..."
          curl -X POST -f "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}"
          echo "Frontend deployment triggered successfully."

      - name: Render Blueprint Sync Notice
        run: |
          echo "========================================================="
          echo "CI Checks Passed! Ready for Render Deployment."
          echo "If using Render Blueprints (render.yaml), Render automatically"
          echo "deploys changes committed to your connected GitHub branch."
          echo "========================================================="

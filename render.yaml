services:
  # =========================================================================
  # 1. FastAPI Backend Web Service
  # =========================================================================
  - type: web
    name: community-intelligence-backend
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SUPABASE_DB_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SMTP2GO_API_KEY
        sync: false
      - key: SENDER_EMAIL
        sync: false
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"

  # =========================================================================
  # 2. Vite React Frontend (Static Site with SPA Routing)
  # =========================================================================
  - type: web
    name: community-intelligence-frontend
    runtime: static
    rootDir: frontend
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: community-intelligence-backend
          property: host
